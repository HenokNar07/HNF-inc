[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-frontier"
version = "0.1.0"
description = "Mean-variance portfolio analysis math engine"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["math_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that hit real APIs (yfinance/Treasury), skipped by default",
]
addopts = "-m 'not network'"
